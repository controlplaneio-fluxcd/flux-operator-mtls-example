apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: backend
spec:
  interval: 1h
  releaseName: podinfo
  serviceAccountName: flux
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: ">=6.17.0 <7.0.0"
  values:
    # The request log carries the client SPIFFE ID at debug level.
    logLevel: debug
    serviceAccount:
      enabled: true
      name: podinfo
    tls:
      enabled: true
    spiffe:
      enabled: true
      authorizedIDs:
        - spiffe://example.org/ns/frontend/sa/podinfo
