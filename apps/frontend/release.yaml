apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: frontend
spec:
  interval: 1h
  releaseName: podinfo
  serviceAccountName: flux
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: ">=6.17.0 <7.0.0"
  values:
    # Pod Security "restricted"; the image declares its user by name, so
    # runAsNonRoot needs the numeric UID.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    serviceAccount:
      enabled: true
      name: podinfo
    tls:
      enabled: true
    spiffe:
      enabled: true
      # /echo calls the backend with the frontend SVID.
      backendMTLS: true
      backendIDs:
        - spiffe://example.org/ns/backend/sa/podinfo
    backends:
      - https://podinfo.backend.svc.cluster.local:9899/echo
