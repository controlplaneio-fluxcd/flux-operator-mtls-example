# helm-controller downloads the chart artifact from source-controller over
# SPIFFE mTLS.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1h
  releaseName: podinfo
  targetNamespace: podinfo
  install:
    createNamespace: true
  chart:
    # helm-controller generates the OCIRepository from this template.
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: ">=6.16.0 <7.0.0"
  values:
    replicaCount: 1
