# Adopts the release installed by the Terraform bootstrap. Until Flux owns
# it, every bootstrap run upgrades the operator.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: flux-operator
  serviceAccountName: flux-operator
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      ref:
        semver: ">=0.62.0"
  valuesFrom:
    - kind: ConfigMap
      name: flux-operator-values
      valuesKey: values.yaml
