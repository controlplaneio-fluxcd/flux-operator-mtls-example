# Reserves the Flux controller ServiceAccounts in flux-system for the Flux
# Deployments. Other workloads in flux-system must bring their own
# ServiceAccount.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-system-serviceaccounts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: protected
      expression: >-
        ['flux-operator', 'source-controller', 'source-watcher',
         'kustomize-controller', 'helm-controller', 'notification-controller']
    - name: kind
      expression: request.resource.resource
    # kube-controller-manager calls the API as the per-controller
    # ServiceAccount with --use-service-account-credentials=true (kubeadm,
    # kind), as itself otherwise.
    - name: deploymentController
      expression: >-
        request.userInfo.username in ['system:serviceaccount:kube-system:deployment-controller',
                                      'system:kube-controller-manager']
    - name: replicaSetController
      expression: >-
        request.userInfo.username in ['system:serviceaccount:kube-system:replicaset-controller',
                                      'system:kube-controller-manager']
    - name: podSpec
      expression: >-
        variables.kind == 'pods' ? object.spec :
        variables.kind == 'cronjobs' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: sa
      expression: >-
        has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '' ?
        variables.podSpec.serviceAccountName : 'default'
    - name: oldSA
      expression: >-
        variables.kind != 'replicasets' || request.operation != 'UPDATE' ? '' :
        has(oldObject.spec.template.spec.serviceAccountName) ?
        oldObject.spec.template.spec.serviceAccountName : 'default'
  validations:
    # Deployments: only the Deployment named after the ServiceAccount.
    # ReplicaSets: only those the deployment-controller creates for it;
    # updates that keep the ServiceAccount are left to the controllers.
    # Pods: only those the replicaset-controller creates. The other
    # built-in workload kinds are denied at creation, so the shared
    # kube-controller-manager identity is enough when per-controller
    # credentials are off.
    - expression: >-
        !(variables.sa in variables.protected) ||
        (variables.kind == 'deployments' && object.metadata.name == variables.sa) ||
        (variables.kind == 'replicasets' &&
          ((request.operation == 'UPDATE' && variables.oldSA == variables.sa) ||
           (variables.deploymentController &&
            has(object.metadata.ownerReferences) &&
            object.metadata.ownerReferences.exists(r,
              r.kind == 'Deployment' && r.name == variables.sa &&
              has(r.controller) && r.controller)))) ||
        (variables.kind == 'pods' && variables.replicaSetController)
      messageExpression: >-
        'ServiceAccount ' + variables.sa + ' is reserved for Deployment flux-system/' +
        variables.sa + '; use a dedicated ServiceAccount'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-system-serviceaccounts
spec:
  policyName: flux-system-serviceaccounts
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: flux-system
---
# The flux ServiceAccount is what Flux impersonates in the infrastructure
# namespaces (cluster-admin) and the app namespaces (namespace admin).
# A pod running as it would get those rights.
# From https://github.com/fluxcd/flux2-multi-tenancy/blob/main/policies/base/pods.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-tenant-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    # Static (mirror) pods have no serviceAccountName.
    - expression: "!has(object.spec.serviceAccountName) || object.spec.serviceAccountName != 'flux'"
      message: "pods cannot run under the 'flux' ServiceAccount"
      reason: Forbidden
---
# Bound in every namespace: the infrastructure namespaces carry no tenant
# label, and no pod runs as flux.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-tenant-pods
spec:
  policyName: flux-tenant-pods
  validationActions: [Deny, Audit]
