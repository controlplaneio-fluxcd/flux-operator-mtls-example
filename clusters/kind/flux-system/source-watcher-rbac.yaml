# The apps ArtifactGenerator creates and prunes the app namespaces.
# source-watcher authorizes the request against the generator's
# ServiceAccount, then acts with its own credentials, which Flux limits to
# reading namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: source-watcher-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: source-watcher-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: source-watcher-namespaces
subjects:
  - kind: ServiceAccount
    name: source-watcher
    namespace: flux-system
