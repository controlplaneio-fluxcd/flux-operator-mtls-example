# Demo only: the Web UI uses anonymous auth, so anyone who can reach it
# acts as cluster-admin. See https://fluxoperator.dev/docs/web-ui/user-management/
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-anonymous-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: flux-admin
