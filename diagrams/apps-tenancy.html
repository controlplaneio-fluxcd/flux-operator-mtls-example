<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Each app gets its own restricted namespace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:      #f5f5f5;
      --paper-2:    #ffffff;
      --ink:        #2d3142;
      --ink-rgb:    45,49,66;
      --muted:      #4f5d75;
      --muted-rgb:  79,93,117;
      --soft:       #7a8399;
      --accent:     #eb6c36;
      --accent-rgb: 235,108,54;
      --link:       #2e5aa8;
      --mtls:       #7646c4;
      --color-paper:  var(--paper);
      --color-ink:    var(--ink);
      --color-muted:  var(--muted);
      --color-accent: var(--accent);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-title:    'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    :root:has(#theme:checked),
    :root:has(#dark:target) {
      --paper:      #2d3142;
      --paper-2:    #393e53;
      --ink:        #f5f5f5;
      --ink-rgb:    245,245,245;
      --muted:      #bfc0c0;
      --muted-rgb:  191,192,192;
      --soft:       #8e98ac;
      --accent:     #f08a59;
      --accent-rgb: 240,138,89;
      --link:       #6a95d8;
      --mtls:       #b394ea;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      padding: 1.25rem 1.5rem 1rem;
    }

    .frame { width: 100%; max-width: 1080px; position: relative; }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      opacity: 0;
      transition: opacity 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .frame:hover .theme-toggle, .theme-toggle:focus-within { opacity: 1; }
    @media print { .theme-toggle { display: none; } }
    .theme-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .theme-toggle .track {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      border: 1px solid rgba(var(--ink-rgb), 0.30);
      background: rgba(var(--ink-rgb), 0.05);
      position: relative;
      transition: background 120ms ease;
    }
    .theme-toggle .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-muted);
      transition: transform 120ms ease;
    }
    .theme-toggle input:checked + .track { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); }
    .theme-toggle input:checked + .track::after { transform: translateX(12px); background: var(--accent); }
    .theme-toggle input:focus-visible + .track { outline: 2px solid var(--link); outline-offset: 2px; }

    h1 {
      font-family: var(--font-title);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }

    svg { width: 100%; min-width: 952px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <span id="dark" hidden></span>
    <label class="theme-toggle"><input type="checkbox" id="theme"><span class="track"></span><span>Dark</span></label>
    <h1>Each app gets its own restricted namespace</h1>

    <svg viewBox="16 16 952 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each app gets its own restricted namespace" aria-describedby="apps-tenancy-desc">
      <desc id="apps-tenancy-desc">source-controller pulls the Git repository over HTTPS and serves it over SPIFFE mTLS to source-watcher. The apps ArtifactGenerator in source-watcher creates one namespace per directory under apps/, with the restricted Pod Security Standard enforced, and publishes the app's ExternalArtifact into it. The apps ResourceSet in flux-operator creates the flux ServiceAccount bound to the namespaced admin role and a Kustomization in each app namespace. kustomize-controller downloads the app artifact from source-watcher over SPIFFE mTLS and applies it as the flux ServiceAccount. Admission policies stop pods from running as the Flux ServiceAccounts.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
        <marker id="arrow-mtls" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--mtls)"/></marker>
      </defs>

      <rect x="16" y="16" width="952" height="440" fill="var(--paper)"/>

      <!-- ===== Arrows ===== -->
      <!-- Git repository -> source-controller -->
      <path d="M184,208 H288" fill="none" stroke="var(--link)" marker-end="url(#arrow-link)" stroke-width="1.2"/>
      <!-- source-controller -> source-watcher -->
      <path d="M440,208 H484 Q492,208 492,200 V72 Q492,64 500,64 H544" fill="none" stroke="var(--mtls)" marker-end="url(#arrow-mtls)" stroke-width="1.2"/>
      <!-- source-watcher -> kustomize-controller -->
      <path d="M620,96 V128" fill="none" stroke="var(--mtls)" marker-end="url(#arrow-mtls)" stroke-width="1.2"/>
      <!-- source-watcher -> app namespaces -->
      <path d="M696,64 H800" fill="none" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- kustomize-controller -> app namespaces -->
      <path d="M696,160 H800" fill="none" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- flux-operator -> app namespaces -->
      <path d="M696,256 H800" fill="none" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- admission policies -> app namespaces -->
      <path d="M696,352 H800" fill="none" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="624" y="106" width="80" height="12" rx="2" fill="var(--paper)"/>
      <text x="628" y="115" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">APP ARTIFACTS</text>
      <rect x="704" y="44" width="88" height="12" rx="2" fill="var(--paper)"/>
      <text x="748" y="53" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NS + ARTIFACT</text>
      <rect x="704" y="140" width="88" height="12" rx="2" fill="var(--paper)"/>
      <text x="748" y="149" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY AS FLUX</text>
      <rect x="704" y="236" width="88" height="12" rx="2" fill="var(--paper)"/>
      <text x="748" y="245" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SA, RBAC, KS</text>
      <rect x="700" y="332" width="96" height="12" rx="2" fill="var(--paper)"/>
      <text x="748" y="341" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO POD AS FLUX</text>

      <!-- ===== Nodes ===== -->
      <!-- Git repository -->
      <rect x="32" y="176" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="32" y="176" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.06)" stroke="rgba(var(--ink-rgb),0.28)" stroke-width="1"/>
      <text x="108" y="206" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git repository</text>
      <text x="108" y="222" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/&lt;app&gt;</text>
      <!-- source-controller -->
      <rect x="288" y="176" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="288" y="176" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="364" y="206" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">source-controller</text>
      <text x="364" y="222" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitRepository</text>
      <!-- source-watcher -->
      <rect x="544" y="32" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="544" y="32" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="620" y="62" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">source-watcher</text>
      <text x="620" y="78" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ArtifactGenerator</text>
      <!-- kustomize-controller -->
      <rect x="544" y="128" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="544" y="128" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="620" y="158" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kustomize-controller</text>
      <text x="620" y="174" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kustomization</text>
      <!-- flux-operator -->
      <rect x="544" y="224" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="544" y="224" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="620" y="254" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flux-operator</text>
      <text x="620" y="270" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ResourceSet</text>
      <!-- Admission policies -->
      <rect x="544" y="320" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="544" y="320" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.06)" stroke="rgba(var(--ink-rgb),0.28)" stroke-width="1"/>
      <text x="620" y="350" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admission policies</text>
      <text x="620" y="366" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Flux SAs reserved</text>
      <!-- App namespaces -->
      <rect x="800" y="32" width="152" height="352" rx="6" fill="var(--paper)"/>
      <rect x="800" y="32" width="152" height="352" rx="6" fill="rgba(var(--accent-rgb),0.08)" stroke="var(--accent)" stroke-width="1"/>
      <text x="876" y="192" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App namespace</text>
      <text x="876" y="208" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frontend · backend</text>
      <text x="876" y="224" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PSS restricted</text>
      <text x="876" y="240" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sa/flux: admin</text>

      <!-- ===== Legend ===== -->
      <line x1="32" y1="416" x2="952" y2="416" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <line x1="32" y1="437" x2="60" y2="437" stroke="var(--link)" marker-end="url(#arrow-link)" stroke-width="1.2"/>
      <text x="68" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">HTTPS</text>
      <line x1="118" y1="437" x2="146" y2="437" stroke="var(--mtls)" marker-end="url(#arrow-mtls)" stroke-width="1.2"/>
      <text x="154" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">SPIFFE mTLS</text>
      <line x1="225" y1="437" x2="253" y2="437" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>
      <text x="261" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Kubernetes API</text>
      <rect x="343" y="432" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="363" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Flux component</text>
    </svg>
  </div>
</body>
</html>
