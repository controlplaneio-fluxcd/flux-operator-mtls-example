<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mTLS Ingress</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:      #f5f5f5;
      --paper-2:    #ffffff;
      --ink:        #2d3142;
      --ink-rgb:    45,49,66;
      --muted:      #4f5d75;
      --muted-rgb:  79,93,117;
      --soft:       #7a8399;
      --accent:     #eb6c36;
      --accent-rgb: 235,108,54;
      --link:       #2e5aa8;
      --color-paper:  var(--paper);
      --color-ink:    var(--ink);
      --color-muted:  var(--muted);
      --color-accent: var(--accent);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-title:    'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    :root:has(#theme:checked),
    :root:has(#dark:target) {
      --paper:      #2d3142;
      --paper-2:    #393e53;
      --ink:        #f5f5f5;
      --ink-rgb:    245,245,245;
      --muted:      #bfc0c0;
      --muted-rgb:  191,192,192;
      --soft:       #8e98ac;
      --accent:     #f08a59;
      --accent-rgb: 240,138,89;
      --link:       #6a95d8;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      padding: 1.25rem 1.5rem 1rem;
    }

    .frame { width: 100%; max-width: 1080px; position: relative; }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      opacity: 0;
      transition: opacity 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .frame:hover .theme-toggle, .theme-toggle:focus-within { opacity: 1; }
    @media print { .theme-toggle { display: none; } }
    .theme-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .theme-toggle .track {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      border: 1px solid rgba(var(--ink-rgb), 0.30);
      background: rgba(var(--ink-rgb), 0.05);
      position: relative;
      transition: background 120ms ease;
    }
    .theme-toggle .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-muted);
      transition: transform 120ms ease;
    }
    .theme-toggle input:checked + .track { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); }
    .theme-toggle input:checked + .track::after { transform: translateX(12px); background: var(--accent); }
    .theme-toggle input:focus-visible + .track { outline: 2px solid var(--link); outline-offset: 2px; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    .eyebrow-url { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--link); }
    .eyebrow-url::before { content: "/"; color: var(--soft); margin: 0 0.6em 0 0.4em; }

    h1 {
      font-family: var(--font-title);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-family: var(--font-title);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    svg { width: 100%; min-width: 912px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <span id="dark" hidden></span>
    <label class="theme-toggle"><input type="checkbox" id="theme"><span class="track"></span><span>Dark</span></label>
    <p class="eyebrow">Architecture<span class="eyebrow-url">fluxoperator.dev</span></p>
    <h1>Ingress over SPIFFE mTLS</h1>
    <p class="subtitle">Plain HTTP to Envoy, SPIFFE mTLS on every hop after it</p>

    <svg viewBox="16 56 912 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ingress over SPIFFE mTLS" aria-describedby="mtls-ingress-desc">
      <desc id="mtls-ingress-desc">Architecture diagram of the traffic through the Envoy Gateway. A Git provider and a browser reach the Envoy proxy over plain HTTP. Envoy routes by host and path: flux.localhost/hook/ to the notification-controller Receiver, flux.localhost/ to the Flux Web UI served by flux-operator, and frontend.localhost/ to the frontend podinfo. Envoy calls each backend with its own SPIFFE SVID and verifies the backend SPIFFE ID. The Web UI downloads artifacts from source-controller and the frontend calls the backend podinfo, both over SPIFFE mTLS.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
      </defs>

      <rect x="16" y="56" width="912" height="600" fill="var(--paper)"/>

      <!-- ===== Zones (painted first) ===== -->
      <!-- Zone: envoy-gateway-system -->
      <rect x="240" y="72" width="208" height="496" rx="8"
            fill="rgba(var(--ink-rgb),0.02)" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <rect x="260" y="76" width="120" height="12" rx="2" fill="var(--paper)"/>
      <text x="320" y="85" fill="var(--soft)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">ENVOY-GATEWAY-SYSTEM</text>

      <!-- Zone: flux-system -->
      <rect x="504" y="168" width="408" height="240" rx="8"
            fill="rgba(var(--ink-rgb),0.02)" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <rect x="524" y="172" width="72" height="12" rx="2" fill="var(--paper)"/>
      <text x="560" y="181" fill="var(--soft)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">FLUX-SYSTEM</text>

      <!-- Zone: app namespaces -->
      <rect x="504" y="424" width="408" height="128" rx="8"
            fill="rgba(var(--ink-rgb),0.02)" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <rect x="524" y="428" width="88" height="12" rx="2" fill="var(--paper)"/>
      <text x="568" y="437" fill="var(--soft)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">APP NAMESPACES</text>

      <!-- ===== Arrows (behind boxes) ===== -->
      <!-- A1 Git provider -> Envoy /hook/ (plain HTTP) -->
      <line x1="184" y1="232" x2="256" y2="232" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A2 Browser -> Envoy flux.localhost (plain HTTP) -->
      <line x1="184" y1="360" x2="256" y2="360" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A3 Browser -> Envoy frontend.localhost (plain HTTP) -->
      <line x1="184" y1="488" x2="256" y2="488" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A4 Envoy -> Receiver (mTLS) -->
      <line x1="432" y1="232" x2="520" y2="232" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A5 Envoy -> Web UI (mTLS) -->
      <line x1="432" y1="360" x2="520" y2="360" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A6 Envoy -> frontend (mTLS) -->
      <line x1="432" y1="488" x2="520" y2="488" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A7 Web UI -> source-controller (mTLS) -->
      <line x1="672" y1="360" x2="744" y2="360" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A8 frontend -> backend (mTLS) -->
      <line x1="672" y1="488" x2="744" y2="488" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (masked, 8px above the stroke) ===== -->
      <rect x="202" y="212" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="220" y="221" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <rect x="202" y="340" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="220" y="349" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <rect x="202" y="468" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="220" y="477" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>

      <rect x="458" y="212" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="476" y="221" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MTLS</text>
      <rect x="458" y="340" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="476" y="349" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MTLS</text>
      <rect x="458" y="468" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="476" y="477" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MTLS</text>

      <rect x="678" y="340" width="60" height="12" rx="2" fill="var(--paper)"/>
      <text x="708" y="349" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ARTIFACTS</text>
      <rect x="690" y="468" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="708" y="477" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ECHO</text>

      <!-- ===== Nodes ===== -->
      <!-- N1: Git provider (external) -->
      <rect x="32" y="200" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="32" y="200" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.03)" stroke="rgba(var(--ink-rgb),0.30)" stroke-width="1"/>
      <rect x="40" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.22)" stroke-width="0.8"/>
      <text x="54" y="217" fill="var(--soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="108" y="236" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git provider</text>
      <text x="108" y="252" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">push webhook</text>

      <!-- N2: Browser (client) -->
      <rect x="32" y="328" width="152" height="192" rx="6" fill="var(--paper)"/>
      <rect x="32" y="328" width="152" height="192" rx="6" fill="rgba(var(--muted-rgb),0.10)" stroke="var(--soft)" stroke-width="1"/>
      <g transform="translate(40,336) scale(0.6667)" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z"/><path d="M4 8h16"/><path d="M8 4v4"/></g>
      <text x="108" y="420" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="108" y="436" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">*.localhost:8080</text>

      <!-- N3: Envoy proxy (focal) with one row per route -->
      <rect x="256" y="104" width="176" height="448" rx="6" fill="var(--paper)"/>
      <rect x="256" y="104" width="176" height="448" rx="6" fill="rgba(var(--accent-rgb),0.08)" stroke="var(--accent)" stroke-width="1"/>
      <rect x="264" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--accent-rgb),0.50)" stroke-width="0.8"/>
      <text x="278" y="121" fill="var(--accent)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L7</text>
      <text x="344" y="140" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Envoy proxy</text>
      <text x="344" y="156" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gateway envoy · :80</text>
      <line x1="256" y1="168" x2="432" y2="168" stroke="rgba(var(--accent-rgb),0.30)" stroke-width="0.8"/>
      <text x="268" y="231" fill="var(--ink)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">flux.localhost/hook/</text>
      <text x="268" y="245" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">SAN sa/notification-controller</text>
      <line x1="256" y1="296" x2="432" y2="296" stroke="rgba(var(--accent-rgb),0.30)" stroke-width="0.8"/>
      <text x="268" y="359" fill="var(--ink)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">flux.localhost/</text>
      <text x="268" y="373" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">SAN sa/flux-operator</text>
      <line x1="256" y1="424" x2="432" y2="424" stroke="rgba(var(--accent-rgb),0.30)" stroke-width="0.8"/>
      <text x="268" y="487" fill="var(--ink)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">frontend.localhost/</text>
      <text x="268" y="501" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">SAN sa/podinfo</text>

      <!-- N4: Receiver (Flux) -->
      <rect x="520" y="200" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="520" y="200" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <rect x="528" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.40)" stroke-width="0.8"/>
      <text x="542" y="217" fill="var(--ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
      <text x="596" y="236" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiver</text>
      <text x="596" y="252" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notification-controller</text>

      <!-- N5: Flux Web UI (Flux) -->
      <rect x="520" y="328" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="520" y="328" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <rect x="528" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.40)" stroke-width="0.8"/>
      <text x="542" y="345" fill="var(--ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="596" y="364" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flux Web UI</text>
      <text x="596" y="380" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flux-operator</text>

      <!-- N6: source-controller (Flux) -->
      <rect x="744" y="328" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="744" y="328" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <rect x="752" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.40)" stroke-width="0.8"/>
      <text x="766" y="345" fill="var(--ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
      <text x="820" y="364" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">source-controller</text>
      <text x="820" y="380" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">artifact storage</text>

      <!-- N7: frontend podinfo (app) -->
      <rect x="520" y="456" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="520" y="456" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.08)" stroke="rgba(var(--ink-rgb),0.25)" stroke-width="1"/>
      <rect x="528" y="464" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
      <text x="542" y="473" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="596" y="492" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">frontend</text>
      <text x="596" y="508" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">podinfo :9899</text>

      <!-- N8: backend podinfo (app) -->
      <rect x="744" y="456" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="744" y="456" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.08)" stroke="rgba(var(--ink-rgb),0.25)" stroke-width="1"/>
      <rect x="752" y="464" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
      <text x="766" y="473" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="820" y="492" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">backend</text>
      <text x="820" y="508" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">podinfo :9899</text>

      <!-- ===== Legend strip ===== -->
      <line x1="32" y1="600" x2="912" y2="600" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <text x="32" y="616" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="628" width="14" height="10" rx="2" fill="rgba(var(--accent-rgb),0.08)" stroke="var(--accent)" stroke-width="1"/>
      <text x="52" y="636" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Gateway</text>

      <rect x="128" y="628" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="148" y="636" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Flux component</text>

      <rect x="264" y="628" width="14" height="10" rx="2" fill="rgba(var(--ink-rgb),0.08)" stroke="rgba(var(--ink-rgb),0.25)" stroke-width="1"/>

      <rect x="392" y="628" width="14" height="10" rx="2" fill="rgba(var(--ink-rgb),0.03)" stroke="rgba(var(--ink-rgb),0.30)" stroke-width="1"/>

    </svg>
  </div>
</body>
</html>
