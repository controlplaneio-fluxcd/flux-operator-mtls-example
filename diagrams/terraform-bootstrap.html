<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraform installs SPIRE and Flux Operator, Flux adopts them</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:      #f5f5f5;
      --paper-2:    #ffffff;
      --ink:        #2d3142;
      --ink-rgb:    45,49,66;
      --muted:      #4f5d75;
      --muted-rgb:  79,93,117;
      --soft:       #7a8399;
      --accent:     #eb6c36;
      --accent-rgb: 235,108,54;
      --link:       #2e5aa8;
      --color-paper:  var(--paper);
      --color-ink:    var(--ink);
      --color-muted:  var(--muted);
      --color-accent: var(--accent);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-title:    'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    :root:has(#theme:checked),
    :root:has(#dark:target) {
      --paper:      #2d3142;
      --paper-2:    #393e53;
      --ink:        #f5f5f5;
      --ink-rgb:    245,245,245;
      --muted:      #bfc0c0;
      --muted-rgb:  191,192,192;
      --soft:       #8e98ac;
      --accent:     #f08a59;
      --accent-rgb: 240,138,89;
      --link:       #6a95d8;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      padding: 1.25rem 1.5rem 1rem;
    }

    .frame { width: 100%; max-width: 1080px; position: relative; }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      opacity: 0;
      transition: opacity 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .frame:hover .theme-toggle, .theme-toggle:focus-within { opacity: 1; }
    @media print { .theme-toggle { display: none; } }
    .theme-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .theme-toggle .track {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      border: 1px solid rgba(var(--ink-rgb), 0.30);
      background: rgba(var(--ink-rgb), 0.05);
      position: relative;
      transition: background 120ms ease;
    }
    .theme-toggle .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-muted);
      transition: transform 120ms ease;
    }
    .theme-toggle input:checked + .track { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); }
    .theme-toggle input:checked + .track::after { transform: translateX(12px); background: var(--accent); }
    .theme-toggle input:focus-visible + .track { outline: 2px solid var(--link); outline-offset: 2px; }

    h1 {
      font-family: var(--font-title);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }

    svg { width: 100%; min-width: 952px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <span id="dark" hidden></span>
    <label class="theme-toggle"><input type="checkbox" id="theme"><span class="track"></span><span>Dark</span></label>
    <h1>Terraform installs SPIRE and Flux Operator, Flux adopts them</h1>

    <svg viewBox="16 16 952 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terraform installs SPIRE and Flux Operator, Flux adopts them" aria-describedby="terraform-bootstrap-desc">
      <desc id="terraform-bootstrap-desc">Terraform runs from the terraform directory of the Git repository and reads the same SPIRE and Flux Operator values files as the Flux HelmReleases. Its flux-operator-bootstrap module installs SPIRE, then Flux Operator, then applies the FluxInstance with SPIFFE mTLS enabled. Flux Operator reconciles the FluxInstance and installs the Flux controllers, which sync clusters/kind from the same repository and adopt the SPIRE and Flux Operator Helm releases.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
      </defs>

      <rect x="16" y="16" width="952" height="440" fill="var(--paper)"/>

      <!-- ===== Arrows ===== -->
      <!-- Terraform -> Git repository -->
      <path d="M252,128 V72 Q252,64 260,64 H432" fill="none" stroke="var(--link)" marker-end="url(#arrow-link)" stroke-width="1.2"/>
      <!-- Flux controllers -> Git repository -->
      <path d="M808,320 V72 Q808,64 800,64 H584" fill="none" stroke="var(--link)" marker-end="url(#arrow-link)" stroke-width="1.2"/>
      <!-- Terraform -> SPIRE -->
      <path d="M328,160 H432" fill="none" stroke="var(--muted)" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- Terraform -> Flux Operator -->
      <path d="M268,192 V248 Q268,256 276,256 H432" fill="none" stroke="var(--muted)" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- Terraform -> FluxInstance -->
      <path d="M236,192 V344 Q236,352 244,352 H432" fill="none" stroke="var(--muted)" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- Flux Operator -> FluxInstance -->
      <path d="M508,288 V320" fill="none" stroke="var(--muted)" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- FluxInstance -> Flux controllers -->
      <path d="M584,352 H688" fill="none" stroke="var(--muted)" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- Flux controllers adopt Flux Operator -->
      <path d="M728,320 V264 Q728,256 720,256 H584" fill="none" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>
      <!-- Flux controllers adopt SPIRE -->
      <path d="M768,320 V168 Q768,160 760,160 H584" fill="none" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="354" y="44" width="52" height="12" rx="2" fill="var(--paper)"/>
      <text x="380" y="53" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECKOUT</text>
      <rect x="620" y="44" width="32" height="12" rx="2" fill="var(--paper)"/>
      <text x="636" y="53" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PULL</text>
      <rect x="350" y="140" width="60" height="12" rx="2" fill="var(--paper)"/>
      <text x="380" y="149" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 INSTALL</text>
      <rect x="350" y="236" width="60" height="12" rx="2" fill="var(--paper)"/>
      <text x="380" y="245" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2 INSTALL</text>
      <rect x="356" y="332" width="48" height="12" rx="2" fill="var(--paper)"/>
      <text x="380" y="341" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3 APPLY</text>
      <rect x="512" y="298" width="60" height="12" rx="2" fill="var(--paper)"/>
      <text x="516" y="307" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">RECONCILE</text>
      <rect x="612" y="332" width="48" height="12" rx="2" fill="var(--paper)"/>
      <text x="636" y="341" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTALL</text>
      <rect x="618" y="236" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="636" y="245" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADOPT</text>
      <rect x="618" y="140" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="636" y="149" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADOPT</text>

      <!-- ===== Nodes ===== -->
      <!-- Git repository -->
      <rect x="432" y="32" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="432" y="32" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.06)" stroke="rgba(var(--ink-rgb),0.28)" stroke-width="1"/>
      <text x="508" y="62" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git repository</text>
      <text x="508" y="78" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terraform/ · clusters/kind</text>
      <!-- Terraform -->
      <rect x="176" y="128" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="176" y="128" width="152" height="64" rx="6" fill="rgba(var(--accent-rgb),0.08)" stroke="var(--accent)" stroke-width="1"/>
      <text x="252" y="158" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Terraform</text>
      <text x="252" y="174" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flux-operator-bootstrap</text>
      <!-- SPIRE -->
      <rect x="432" y="128" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="432" y="128" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.06)" stroke="rgba(var(--ink-rgb),0.28)" stroke-width="1"/>
      <text x="508" y="158" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SPIRE</text>
      <text x="508" y="174" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">server · agent · CSI</text>
      <!-- Flux Operator -->
      <rect x="432" y="224" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="432" y="224" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="508" y="254" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flux Operator</text>
      <text x="508" y="270" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SVID via CSI</text>
      <!-- FluxInstance -->
      <rect x="432" y="320" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="432" y="320" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="508" y="350" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FluxInstance</text>
      <text x="508" y="366" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spec.spiffe.mtls</text>
      <!-- Flux controllers -->
      <rect x="688" y="320" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="688" y="320" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="764" y="350" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flux controllers</text>
      <text x="764" y="366" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mTLS between them</text>

      <!-- ===== Legend ===== -->
      <line x1="32" y1="416" x2="952" y2="416" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <line x1="32" y1="437" x2="60" y2="437" stroke="var(--muted)" marker-end="url(#arrow)" stroke-width="1.2"/>
      <text x="68" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Install or reconcile</text>
      <line x1="172" y1="437" x2="200" y2="437" stroke="var(--muted)" stroke-dasharray="4,3" marker-end="url(#arrow)" stroke-width="1.2"/>
      <text x="208" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Adopted by Flux</text>
      <line x1="294" y1="437" x2="322" y2="437" stroke="var(--link)" marker-end="url(#arrow-link)" stroke-width="1.2"/>
      <text x="330" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Read from Git</text>
      <rect x="408" y="432" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <text x="428" y="440" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Flux component</text>
    </svg>
  </div>
</body>
</html>
