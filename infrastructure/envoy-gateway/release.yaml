apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  timeout: 10m
  releaseName: envoy-gateway
  chart:
    kind: OCIRepository
    spec:
      url: oci://docker.io/envoyproxy/gateway-helm
      ref:
        semver: ">=1.9.0 <2.0.0"
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    config:
      envoyGateway:
        extensionApis:
          # Lets Gateways and EnvoyProxies reference SPIRE agent SDS secrets.
          enableSDSSecretRef: true
