# podinfo logs every payload POSTed to /api/echo at debug level.
apiVersion: v1
kind: Namespace
metadata:
  name: event-sink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-sink
  namespace: event-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-sink
  template:
    metadata:
      labels:
        app: event-sink
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.16.0
          command:
            - ./podinfo
            - --port=8080
            - --level=debug
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: event-sink
  namespace: event-sink
spec:
  selector:
    app: event-sink
  ports:
    - name: http
      port: 80
      targetPort: http
