# Adopts the releases installed by the Terraform bootstrap. Release names and
# namespace must match the bootstrap install, or helm-controller installs a
# second release. After adoption the bootstrap no longer touches them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spire-system
spec:
  interval: 1h
  releaseName: spire-crds
  serviceAccountName: flux
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/spiffe/helm-charts/spire-crds
      ref:
        semver: "0.6.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-system
spec:
  interval: 1h
  timeout: 10m
  releaseName: spire
  serviceAccountName: flux
  dependsOn:
    - name: spire-crds
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/spiffe/helm-charts/spire
      ref:
        semver: "0.30.x"
  valuesFrom:
    - kind: ConfigMap
      name: spire-values
      valuesKey: values.yaml
